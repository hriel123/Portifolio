<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>Imagem de prévia (1200x630)</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<!-- Fonte da imagem assets/og/og-image.jpg. Para gerar de novo:
chrome-headless-shell --hide-scrollbars --window-size=1200,630 \
--screenshot=og.png <url>/assets/og/card.html  (depois converter para JPG) -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 80px;
    background:
      radial-gradient(ellipse at 85% 0%, rgba(0,200,255,0.16) 0%, transparent 50%),
      radial-gradient(ellipse at 0% 100%, rgba(123,97,255,0.16) 0%, transparent 50%),
      #080b10;
    color: #e8edf5;
    font-family: 'DM Sans', sans-serif;
  }

  body::after {
    content: '';
    position: absolute;
    inset: 24px;
    border: 1px solid #1e2a3a;
    border-radius: 24px;
    pointer-events: none;
  }

  .text { flex: 1; min-width: 0; }

  .brand {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: #00c8ff;
    letter-spacing: 0.04em;
  }

  h1 {
    margin-top: 28px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 68px;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  h1 span {
    display: block;
    width: fit-content;
    background: linear-gradient(90deg, #00c8ff, #7b61ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .role {
    margin-top: 24px;
    font-size: 23px;
    color: #9aa7ba;
  }

  .role strong { color: #e8edf5; font-weight: 600; }

  .chips { display: flex; gap: 12px; margin-top: 28px; }

  .chip {
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid rgba(0,200,255,0.35);
    background: rgba(0,200,255,0.08);
    color: #00c8ff;
    font-size: 19px;
    font-weight: 600;
  }

  .url {
    position: absolute;
    left: 80px;
    bottom: 52px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 19px;
    color: #7e8ca0;
  }

  .photo {
    flex-shrink: 0;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 6px #080b10, 0 0 0 9px #00c8ff, 0 0 60px rgba(0,200,255,0.35);
  }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">HSF.dev</div>
    <h1>Hariel<span>Silva Fabrício</span></h1>
    <p class="role">Técnico em <strong>Informática</strong> · Estagiário de <strong>Gestão de TI</strong> na Delfos</p>
    <div class="chips">
      <span class="chip">Cloud Computing</span>
      <span class="chip">Desenvolvimento</span>
      <span class="chip">AWS &amp; Huawei Cloud</span>
    </div>
  </div>
  <img class="photo" src="../curriculo/foto.jpg" alt="" width="400" height="400" />
  <div class="url">hriel123.github.io/Portifolio</div>
</body>
</html>
